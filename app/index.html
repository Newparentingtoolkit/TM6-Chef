<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>TM6 Chef</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2321;--mute:#66706b;--line:#e2ded4;--accent:#1f6f54;--accent-ink:#fff;--chip:#e8f2ed;--warn:#b3412a}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--card:#1d2321;--ink:#eef1ef;--mute:#9aa6a0;--line:#2c3532;--accent:#4fb58c;--accent-ink:#0b1410;--chip:#24332d;--warn:#e58a72}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:18px;margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;color:var(--mute);padding:6px 12px;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
main{flex:1;overflow-y:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.danger{background:none;color:var(--warn);border:1px solid var(--warn)}
.btn.big{padding:16px 20px;font-size:18px;border-radius:16px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row>.btn{flex:0 1 auto;padding:9px 14px;font-size:15px}
.src{font-size:14px;margin-top:8px}.src a{color:var(--accent);word-break:break-all}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.mute{color:var(--mute);font-size:14px}
h2{font-size:20px;margin:6px 0}
h3{font-size:16px;margin:16px 0 6px}
.chat{display:flex;flex-direction:column;height:100%}
#msgs{flex:1;overflow-y:auto;padding-bottom:8px}
.bubble{max-width:92%;padding:10px 14px;border-radius:16px;margin:8px 0;word-wrap:break-word;overflow-wrap:anywhere}
.bubble.user{background:var(--accent);color:var(--accent-ink);margin-left:auto;border-bottom-right-radius:4px}
.bubble.model{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.compose{display:flex;gap:8px;align-items:flex-end;padding-top:8px}
.compose textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);color:var(--ink);font:inherit;max-height:120px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;width:44px;height:44px;font-size:20px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px}
input[type=text],input[type=password],input[type=search],input[type=number],textarea.ta,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
label{display:block;font-weight:600;margin:14px 0 4px}
ul.ing{list-style:none;padding:0;margin:0}
ul.ing li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
ul.ing li b{min-width:76px}
ol.steps{padding-left:22px;margin:0}
ol.steps li{margin:10px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;border:0;color:var(--ink)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.2}}
.shop li{align-items:center}
.shop li.done span{text-decoration:line-through;color:var(--mute)}
.hidden{display:none!important}
/* Editing, portions, notes */
.field{margin:8px 0}.field label{margin:0 0 3px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid12{display:grid;grid-template-columns:1fr 2fr;gap:8px}
textarea.ta{resize:vertical}
.edrow{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--card)}
.mini{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:15px;font-weight:600}
.mini.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mini[disabled]{opacity:.4}
.stars button{background:none;border:0;font-size:26px;padding:0 2px;color:var(--mute);line-height:1}
.stars button.on{color:#e0a100}
.banner{background:var(--chip);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.bar2{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.warn{color:var(--warn);font-size:14px;margin:6px 0}
/* Cook mode */
#cook{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#cook .top{display:flex;align-items:center;gap:10px;padding:10px 16px}
#cook .top .t{flex:1;min-width:0}
#cook .top .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:var(--line)}.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
#cookBody{flex:1;overflow-y:auto;padding:16px}
.bigtext{font-size:24px;line-height:1.35;margin:12px 0 18px}
.setting{display:flex;gap:10px;flex-wrap:wrap}
.set{background:var(--chip);border:0;border-radius:16px;padding:12px 16px;text-align:center;min-width:92px;color:var(--ink)}
.set small{display:block;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.set b{font-size:26px}
.timers{padding:0 16px}
.tm{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0}
.tm.done{border-color:var(--warn);color:var(--warn);font-weight:700}
.tm b{font-size:20px;font-variant-numeric:tabular-nums}
#cook .foot{display:flex;gap:10px;padding:12px 16px}
#cook .foot .btn{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;max-width:88%;text-align:center}
</style>
</head>
<body>
<header>
  <h1>🍲 TM6 Chef</h1>
  <div class="seg" id="langSeg"><button data-lang="en">EN</button><button data-lang="pl">PL</button></div>

<script>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("tm6." + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tm6." + k, JSON.stringify(v)); } catch { } }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- strings ---------- */

    search: "Szukaj przepisów…", back: "Wstecz", next: "Dalej", prev: "Poprzedni", start: "Start", finish: "Zakończ",
    before: "Zanim zaczniesz", step: "Krok", of: "z", enjoy: "Smacznego! 🍽️", close: "Zamknij",

    edit: "Edytuj", cancel: "Anuluj", saveEdit: "Zapisz zmiany", edSaved: "Przepis zaktualizowany", needTitle: "Podaj tytuł przepisu.", confirmDiscard: "Wyjść bez zapisywania zmian?",

    fEquip: "Sprzęt (po przecinku)", fGroup: "Grupa (opcjonalnie)", fAmount: "Ilość", fName: "Składnik", fStep: "Co zrobić", fMode: "Tryb", fTime: "Czas (np. 5 min)",
    fTemp: "Temp. °C / Varoma", fSpeed: "Prędkość", fRev: "Obroty wsteczne", fTimer: "Czas oczekiwania poza urządzeniem (min)", fTips: "Wskazówki, jedna na linię",

    favourite: "Ulubiony", favOnly: "Tylko ulubione", portions: "Porcje", scaleSave: "Zapisz ten rozmiar",
    scaleNote: "Ilości składników zostały przeliczone. Czasy, ustawienia i ilości wpisane w treści kroków zostają bez zmian, więc sprawdź je.",

    backupHint: "Przepisy są zapisane tylko na tym telefonie. W menu udostępniania wybierz Dysk lub Pliki, aby zachować bezpieczną kopię.", backupNow: "Zrób kopię teraz", later: "Później", backupDone: "Kopia zapisana ✓",

    importTitle: "Importuj przepisy ze zdjęć lub PDF", importPick: "Wybierz pliki", importing: "Czytam przepis", importDone: "Zaimportowano", importDup: "już zapisane", importFail: "błędy",
    importOne: "Wszystkie pliki to JEDEN przepis (kilka zrzutów ekranu tego samego przepisu)",

/* ---------- state ---------- */
let settings = Object.assign({ apiKey: "", model: "gemini-2.5-flash", lang: "en", uiLang: "en" }, store.get("settings", {}));
let recipes = store.get("recipes", []);
let shop = store.get("shop", []);
let chat = store.get("chat", []);
let tab = "chat", detailId = null, busy = false, pendingImages = [], pendingContext = null;
const t = k => (STR[settings.uiLang] || STR.en)[k] ?? STR.en[k] ?? k;
const saveSettings = () => store.set("settings", settings);
const saveRecipes = () => store.set("recipes", recipes);
const saveShop = () => store.set("shop", shop);
const saveChat = () => store.set("chat", chat.slice(-40).map(m => ({ ...m, images: undefined })));

function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.remove("hidden");
  clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.add("hidden"), 2600);
}

/* ---------- recipe helpers ---------- */
function normRecipe(r) {
  r = r || {};
  const steps = Array.isArray(r.steps) ? r.steps.map(s => typeof s === "string" ? { text: s } : s) : [];
  return {
    id: r.id || uid(), title: r.title || "Recipe", description: r.description || "",
    servings: r.servings || 4, prep_min: r.prep_min || 0, cook_min: r.cook_min || 0, total_min: r.total_min || 0,
    difficulty: r.difficulty || "", equipment: Array.isArray(r.equipment) ? r.equipment : [],
    ingredients: Array.isArray(r.ingredients) ? r.ingredients.map(i => typeof i === "string" ? { amount: "", name: i, group: "" } : i) : [],
    steps: steps.map(s => ({ text: s.text || "", tm: s.tm && typeof s.tm === "object" ? s.tm : null, timer_min: s.timer_min || null })),
    tips: Array.isArray(r.tips) ? r.tips : [],
    sources: Array.isArray(r.sources) ? r.sources.filter(s => s && /^https:\/\//.test(s.url)) : [],
    fav: !!r.fav, rating: Math.max(0, Math.min(5, +r.rating || 0)), notes: r.notes || "", lastCooked: r.lastCooked || "", updated: +r.updated || 0
  };
}
function parseSecs(str) {
  if (!str) return 0;
  let total = 0, m; const re = /(\d+(?:[.,]\d+)?)\s*(h|godz|hr|hour|min|m|sec|sek|s)\w*/gi;
  while ((m = re.exec(String(str)))) {
    const n = parseFloat(m[1].replace(",", ".")), u = m[2].toLowerCase();
    total += /^(h|godz|hr|hour)/.test(u) ? n * 3600 : /^(min|m)$/.test(u) ? n * 60 : n;
  }
  return Math.round(total);
}
function recipeBody(r, withTitle = true) {
  const groups = []; let last = null;
  r.ingredients.forEach(i => { const g = i.group || ""; if (g !== last || !groups.length) { groups.push({ g, items: [] }); last = g; } groups[groups.length - 1].items.push(i); });
  const meta = [`${r.servings} ${t("servings")}`, r.prep_min ? `${t("prep")} ${r.prep_min} ${t("min")}` : "", r.cook_min ? `${t("cookT")} ${r.cook_min} ${t("min")}` : "",
    r.total_min ? `${t("total")} ${r.total_min} ${t("min")}` : "", r.difficulty ? (t("difficulty")[r.difficulty] || r.difficulty) : ""].filter(Boolean);
  return `${withTitle ? `<h2>${esc(r.title)}</h2>` : ""}
    ${r.description ? `<div class="mute">${esc(r.description)}</div>` : ""}
    <div class="meta">${meta.map(m => `<span class="chip">${esc(m)}</span>`).join("")}</div>
    ${r.equipment.length ? `<h3>${t("equipment")}</h3><div class="mute">${esc(r.equipment.join(", "))}</div>` : ""}
    <h3>${t("ingredients")}</h3>
    ${groups.map(g => `${g.g ? `<div class="mute"><b>${esc(g.g)}</b></div>` : ""}<ul class="ing">${g.items.map(i => `<li><b>${esc(i.amount)}</b><span>${esc(i.name)}</span></li>`).join("")}</ul>`).join("")}
    <h3>${t("steps")}</h3>
    ${r.steps.length ? `<ol class="steps">${r.steps.map(s => `<li>${esc(s.text)}${tmChips(s)}</li>`).join("")}</ol>` : `<div class="mute">${t("noSteps")}</div>`}
    ${r.tips.length ? `<h3>${t("tips")}</h3><ul>${r.tips.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${sourceLinks(r.sources)}`;
}
function sourceLinks(list) {
  const ok = (list || []).filter(s => s && /^https:\/\//.test(s.url));

function fileToB64(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = rej; img.src = url;
  });
}

async function callGemini() {

  }));
  return geminiRequest(systemPrompt(), contents, 0.6, true);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function geminiRequest(sys, contents, temperature, useSearch) {
  let search = !!useSearch; // Google Search grounding: lets the AI find real recipes and return their links
  for (let attempt = 0; ; attempt++) {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.model)}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": settings.apiKey },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: sys }] }, contents, ...(search ? { tools: [{ google_search: {} }] } : {}), generationConfig: { temperature } })
    });
    const j = await r.json().catch(() => ({}));
    if ((r.status === 429 || r.status === 503) && attempt < 3) { await sleep(20000); continue; } // rate limit / busy: wait and retry
    if (r.status === 400 && search) { search = false; continue; } // this model may not support search: retry without it
    if (!r.ok) throw new Error(j.error?.message || ("HTTP " + r.status));
    const text = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
    if (!text) throw new Error(j.promptFeedback?.blockReason || "Empty reply");
    const sources = [];
    for (const c of j.candidates?.[0]?.groundingMetadata?.groundingChunks || []) {
      const w = c.web;
      if (w?.uri && /^https:\/\//.test(w.uri) && !sources.some(s => s.url === w.uri)) sources.push({ title: w.title || w.uri, url: w.uri });
    }
    return { text, sources };
  }
}
const extractPrompt = () => "You turn photos, screenshots or PDFs of ONE recipe into structured data. Copy the recipe faithfully: keep the original title, ingredients with their amounts, the order of the steps and every Thermomix setting (time, temperature, speed, reverse, mode) exactly as shown. Do not invent, improve or add anything. If a part is unreadable, leave it out. Keep the recipe's original language. Several images belong to the same recipe, in reading order. Answer with ONE fenced code block labelled recipe containing only valid JSON in this shape: " + RECIPE_SCHEMA + '. In "tm", time like "5 sec" or "10 min", temp like "100" or "Varoma", speed like "1" or "Turbo"; use null for steps without machine settings. If the files do not contain a recipe, answer exactly: NO_RECIPE';
function fileToPart(file) {
  if (file.type === "application/pdf") {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res({ inline_data: { mime_type: "application/pdf", data: String(fr.result).split(",")[1] } });
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  }
  return fileToB64(file).then(d => ({ inline_data: { mime_type: "image/jpeg", data: d } }));
}
async function extractRecipe(files) {
  const parts = []; for (const f of files) parts.push(await fileToPart(f));
  parts.push({ text: "Extract the recipe." });
  const { text: raw } = await geminiRequest(extractPrompt(), [{ role: "user", parts }], 0.1);
  const { recipe } = splitReply(raw);
  if (!recipe || !recipe.steps.length) throw new Error("No recipe found");
  return recipe;
}
async function importFiles(files, oneRecipe) {
  if (!settings.apiKey) { toast(t("needKey")); return setTab("settings"); }
  const log = $("#impLog"), jobs = oneRecipe ? [files] : files.map(f => [f]);
  let ok = 0, dup = 0; const failed = [];
  for (let n = 0; n < jobs.length; n++) {
    if (!$("#impLog")) break; // user left the page
    log.textContent = `${t("importing")} ${n + 1} / ${jobs.length}…`;
    try {
      const r = await extractRecipe(jobs[n]);
      if (recipes.some(x => x.title.trim().toLowerCase() === r.title.trim().toLowerCase())) dup++;
      else { recipes.unshift(r); saveRecipes(); ok++; }
    } catch (e) { failed.push(jobs[n].map(f => f.name).join(", ") + " (" + e.message + ")"); }
    if (n < jobs.length - 1) await sleep(7000); // free Gemini keys allow roughly 10 requests a minute
  }
  const l2 = $("#impLog");
  if (l2) l2.innerHTML = `<b>${t("importDone")}: ${ok}</b> · ${t("importDup")}: ${dup} · ${t("importFail")}: ${failed.length}` +
    (failed.length ? `<div class="mute">${failed.map(esc).join("<br>")}</div>` : "");
  if (tab === "library" && !detailId) fillList($("#q")?.value || "");
}
function splitReply(raw) {
  const re = /```(?:recipe|json)\s*([\s\S]*?)```/i, m = raw.match(re);
  let recipe = null;
  if (m) { try { recipe = normRecipe(JSON.parse(m[1])); } catch { recipe = null; } }
  return { text: (recipe ? raw.replace(re, "") : raw).trim(), recipe };
}

    [0, 0.35, 0.7].forEach(d => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.value = 0.25;
      o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + 0.2);
    });
  } catch { }
  try { navigator.vibrate?.([300, 150, 300, 150, 300]); } catch { }
}
const fmtTime = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function renderTimers() {
  const el = $("#timers"); if (!el) return;
  el.innerHTML = timers.map(x => `<div class="tm ${x.done ? "done" : ""}"><span>⏲ ${esc(x.label)}</span>
    ${x.done ? `<span>${t("timeUp")}</span>` : `<b data-end="${x.end}">${fmtTime(x.end - Date.now())}</b>`}
    <button class="btn sec" data-act="timerX" data-id="${x.id}">${x.done ? t("dismiss") : "✕"}</button></div>`).join("");
}
setInterval(() => {
  let changed = false;
  timers.forEach(x => { if (!x.done && Date.now() >= x.end) { x.done = true; changed = true; beep(); } });
  if (changed) renderTimers();
  else document.querySelectorAll("#timers b[data-end]").forEach(b => b.textContent = fmtTime(+b.dataset.end - Date.now()));
}, 500);

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const nav = e.target.closest("#nav button"); if (nav) return setTab(nav.dataset.tab);
  const lg = e.target.closest("#langSeg button");
  if (lg) { settings.lang = lg.dataset.lang; saveSettings(); renderChrome(); if (tab === "settings") viewSettings(); return; }
  if (e.target.id === "attach") return $("#file").click();
  if (e.target.id === "clearBtn") { if (chat.length && confirm(t("confirmClear"))) { chat = []; pendingContext = null; adaptTarget = null; saveChat(); renderMsgs(); } return; }
  if (e.target.id === "favFilter") { favOnly = !favOnly; e.target.classList.toggle("on", favOnly); fillList($("#q").value); return; }
  if (e.target.id === "sendBtn") return send();
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, msg = chat[+el.dataset.i];
  switch (a) {
    case "cookMsg": return openCook(msg.recipe);
    case "saveMsg": if (!recipes.some(x => x.id === msg.recipe.id)) { msg.recipe.updated = Date.now(); recipes.unshift(msg.recipe); saveRecipes(); } return renderMsgs();
    case "copyMsg": if (!recipes.some(x => x.id === msg.recipe.id)) {
      if (recipes.some(x => x.title === msg.recipe.title)) msg.recipe.title += " (2)"; // keep titles distinguishable in the list
      msg.recipe.updated = Date.now(); recipes.unshift(msg.recipe); saveRecipes(); saveChat();
    } adaptTarget = null; return renderMsgs();
    case "replaceMsg": {
      const i = recipes.findIndex(x => x.id === msg.adaptOf);
      if (i < 0 || !confirm(t("confirmReplace").replace("{t}", recipes[i].title))) return;
      const o = recipes[i];
      msg.recipe.id = o.id; recipes[i] = { ...msg.recipe, fav: o.fav, rating: o.rating, notes: o.notes, lastCooked: o.lastCooked, updated: Date.now() };
      saveRecipes(); saveChat(); adaptTarget = null; renderMsgs(); return toast(t("replaced"));
    }
    case "shopMsg": return addToShop(msg.recipe);
    case "openLib": detailId = el.dataset.id; detailScale = 1; return viewLibrary();
    case "libBack": detailId = null; detailScale = 1; return viewLibrary();
    case "cookLib": { const r = recipes.find(x => x.id === detailId); return openCook(detailScale === 1 ? r : scaleRecipe(r, detailScale)); }
    case "shopLib": { const r = recipes.find(x => x.id === detailId); return addToShop(detailScale === 1 ? r : scaleRecipe(r, detailScale)); }
    case "adaptLib": { const r = recipes.find(x => x.id === detailId); pendingContext = detailScale === 1 ? r : scaleRecipe(r, detailScale); adaptTarget = r.id; setTab("chat"); $("#input").value = t("adaptHint"); $("#input").focus(); return; }
    case "delLib": if (confirm(t("confirmDel"))) { recipes = recipes.filter(x => x.id !== detailId); saveRecipes(); detailId = null; viewLibrary(); } return;
    case "fav": { const r = recipes.find(x => x.id === detailId); r.fav = !r.fav; r.updated = Date.now(); saveRecipes(); return keepScroll(viewLibrary); }
    case "rate": { const r = recipes.find(x => x.id === detailId), n = +el.dataset.n; r.rating = r.rating === n ? 0 : n; r.updated = Date.now(); saveRecipes(); return keepScroll(viewLibrary); }
    case "scale": detailScale = +el.dataset.f; return keepScroll(viewLibrary);
    case "scaleSave": {
      const i = recipes.findIndex(x => x.id === detailId); recipes[i] = { ...scaleRecipe(recipes[i], detailScale), updated: Date.now() };
      detailScale = 1; saveRecipes(); keepScroll(viewLibrary); return toast(t("edSaved"));
    }
    case "editLib": editId = detailId; editDraft = clone(recipes.find(x => x.id === detailId)); detailScale = 1; $("#view").scrollTop = 0; return viewLibrary();
    case "edCancel": if (!confirm(t("confirmDiscard"))) return; editDraft = null; editId = null; return viewLibrary();
    case "edSave": {
      const o = finalizeDraft(editDraft);
      if (!o.title) return toast(t("needTitle"));
      const i = recipes.findIndex(x => x.id === editId); if (i >= 0) recipes[i] = o;
      saveRecipes(); editDraft = null; editId = null; viewLibrary(); return toast(t("edSaved"));
    }
    case "edAdd": return keepScroll(() => { (el.dataset.kind === "ing" ? editDraft.ingredients : editDraft.steps).push(el.dataset.kind === "ing" ? { group: "", amount: "", name: "" } : { text: "", tm: null, timer_min: null }); viewEdit(); });
    case "edDel": return keepScroll(() => { (el.dataset.kind === "ing" ? editDraft.ingredients : editDraft.steps).splice(+el.dataset.i, 1); viewEdit(); });
    case "edMove": return keepScroll(() => {
      const arr = el.dataset.kind === "ing" ? editDraft.ingredients : editDraft.steps, i = +el.dataset.i, j = i + +el.dataset.d;
      if (j >= 0 && j < arr.length) { [arr[i], arr[j]] = [arr[j], arr[i]]; } viewEdit();
    });
    case "bkLater": store.set("backup", { ...store.get("backup", {}), snooze: Date.now() + 3 * 864e5 }); return $("#bk")?.remove();
    case "sample": recipes.unshift(normRecipe({ ...SAMPLE, id: uid() })); saveRecipes(); return viewLibrary();
    case "tick": { const x = shop.find(s => s.id === el.dataset.id); x.done = el.checked; saveShop(); return viewShop(); }
    case "shopDone": shop = shop.filter(x => !x.done); saveShop(); return viewShop();
    case "shopClear": shop = []; saveShop(); return viewShop();
    case "shopShare": {
      const txt = shop.map(x => (x.done ? "✓ " : "• ") + shopText(x)).join("\n");
      if (navigator.share) { try { await navigator.share({ title: "Shopping list", text: txt }); } catch { } }
      else { try { await navigator.clipboard.writeText(txt); toast("Copied"); } catch { } }
      return;
    }
    case "saveSettings": {
      settings.apiKey = $("#s_key").value.trim(); settings.model = $("#s_model").value.trim() || "gemini-2.5-flash";
      saveSettings(); $("#keyState").textContent = settings.apiKey ? t("keySet") : t("keyMissing"); return toast(t("settingsSaved"));
    }
    case "export": return exportBackup();
    case "import": return $("#impFile").click();
    case "impPick": return $("#impFiles").click();
    case "clearChat": chat = []; pendingContext = null; saveChat(); toast("OK"); return;
    case "cookClose": return closeCook();
    case "cookPrev": cook.i = Math.max(-1, cook.i - 1); return renderCook();
    case "cookNext": if (cook.i >= cook.r.steps.length) return closeCook(); cook.i++; if (cook.i === cook.r.steps.length) markCooked(cook.r.id); return renderCook();
    case "cookIng": { const keep = cook.i; cook.i = -1; renderCook(); cook.i = keep; $("#cook .foot").innerHTML = `<button class="btn big" data-act="cookResume">${t("back")}</button>`; return; }
    case "cookResume": return renderCook();
    case "timer": return startTimer(+el.dataset.secs, el.dataset.label);
    case "timerX": timers = timers.filter(x => x.id !== el.dataset.id); return renderTimers();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") fillList(e.target.value);
  if (e.target.dataset?.f && editDraft) setField(e.target);
  if (e.target.id === "notes") { const r = recipes.find(x => x.id === detailId); if (r) { r.notes = e.target.value; r.updated = Date.now(); saveRecipes(); } }
  if (e.target.id === "s_key") { settings.apiKey = e.target.value.trim(); saveSettings(); const k = $("#keyState"); if (k) k.textContent = settings.apiKey ? t("keySet") : t("keyMissing"); }
  if (e.target.id === "s_model") { settings.model = e.target.value.trim() || "gemini-2.5-flash"; saveSettings(); }
  if (e.target.id === "input") { e.target.style.height = "auto"; e.target.style.height = Math.min(120, e.target.scrollHeight) + "px"; }
});
document.addEventListener("change", async e => {
  const id = e.target.id;
  if (id === "s_key") { settings.apiKey = e.target.value.trim(); saveSettings(); }
  if (id === "s_model") { settings.model = e.target.value.trim() || "gemini-2.5-flash"; saveSettings(); }
  if (id === "s_lang") { settings.lang = e.target.value; saveSettings(); renderChrome(); }
  if (id === "s_ui") { settings.uiLang = e.target.value; saveSettings(); render(); }
  if (id === "file") {
    for (const f of e.target.files) { try { pendingImages.push(await fileToB64(f)); } catch { } }
    e.target.value = ""; renderThumbs();
  }
  if (id === "impFiles") {
    const files = [...e.target.files]; e.target.value = "";
    if (files.length) importFiles(files, $("#impOne").checked);
  }
  if (id === "impFile") {
    try {
      const d = JSON.parse(await e.target.files[0].text());
      if (Array.isArray(d.recipes)) {
        d.recipes.forEach(r => { // new ids are added; same id is replaced only when the backup copy is newer
          r = normRecipe(r); const i = recipes.findIndex(x => x.id === r.id);
          if (i < 0) recipes.push(r); else if (r.updated > (recipes[i].updated || 0)) recipes[i] = r;
        });
        saveRecipes();
      }
      if (Array.isArray(d.shop)) { shop = d.shop; saveShop(); }
      toast(t("imported"));
    } catch (err) { toast(t("error") + err.message); }
  }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "input" && e.key === "Enter" && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); send(); }
});

/* ---------- editing, portions, backup ---------- */
let editDraft = null, editId = null, detailScale = 1, favOnly = false, adaptTarget = null;
function keepScroll(fn) { const v = $("#view"), y = v.scrollTop; fn(); v.scrollTop = y; }
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => new Date().toISOString().slice(0, 10);

function fmtQty(n, unit) {
  const u = unit.trim();
  if (/^(g|ml)\b/i.test(u)) { if (n >= 50) return String(Math.round(n / 5) * 5); if (n >= 10) return String(Math.round(n)); return String(Math.round(n * 2) / 2); }
  if (/^(kg|l|dl|cl)\b/i.test(u)) return String(+n.toFixed(2));
  if (n >= 10) return String(Math.round(n));
  const q = Math.round(n * 4) / 4, w = Math.floor(q);
  if (q === 0) return String(+n.toFixed(2));
  return (w ? String(w) : "") + { 0: "", 0.25: "¼", 0.5: "½", 0.75: "¾" }[q - w];
}
function scaleAmount(str, f) {
  const m = String(str || "").match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*(.*)$/);
  if (!m) return str;
  const num = x => { let k; x = x.trim(); if ((k = x.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +k[1] + k[2] / k[3]; if ((k = x.match(/^(\d+)\/(\d+)$/))) return k[1] / k[2]; return parseFloat(x.replace(",", ".")); };
  const unit = m[3], a = fmtQty(num(m[1]) * f, unit), b = m[2] ? fmtQty(num(m[2]) * f, unit) : "";
  return a + (b ? "–" + b : "") + (unit ? " " + unit : "");
}
function scaleRecipe(r, f) {
  const o = clone(r);
  o.servings = Math.round(r.servings * f * 2) / 2;
  o.ingredients.forEach(i => { i.amount = scaleAmount(i.amount, f); });
  return o;
}
// Total grams/millilitres of all ingredients: a rough check against the bowl's 2.2 L MAX line.
function weighedTotal(r) {
  let sum = 0;
  r.ingredients.forEach(i => {
    const m = String(i.amount || "").match(/^\s*(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l)\b/i); if (!m) return;
    const n = parseFloat(m[1].replace(",", ".")), u = m[2].toLowerCase();
    sum += u === "kg" || u === "l" ? n * 1000 : n;
  });
  return sum;
}

function setField(el) {
  const p = el.dataset.f.split("."), v = el.type === "checkbox" ? el.checked : el.value, d = editDraft;
  if (p[0] === "ing") d.ingredients[+p[1]][p[2]] = v;
  else if (p[0] === "step") {
    const s = d.steps[+p[1]];
    if (p[2] === "tm") { s.tm = s.tm || {}; s.tm[p[3]] = v; }
    else if (p[2] === "timer_min") s.timer_min = v === "" ? null : +v;
    else s[p[2]] = v;
  }
  else if (p[0] === "equipment") d.equipment = v.split(",").map(x => x.trim()).filter(Boolean);
  else if (p[0] === "tips") d.tips = v.split("\n").map(x => x.trim()).filter(Boolean);
  else if (["servings", "prep_min", "cook_min", "total_min"].includes(p[0])) d[p[0]] = +v || 0;
  else d[p[0]] = v;
}
function viewEdit() {
  const d = editDraft, n1 = d.ingredients.length, n2 = d.steps.length;
  const inp = (label, path, val, type = "text") => `<div class="field"><label>${label}</label><input type="${type}" ${type === "number" ? 'inputmode="decimal" min="0"' : ""} data-f="${path}" value="${esc(val)}"></div>`;
  const btns = (kind, i, n) => `<div class="row" style="margin:6px 0 0"><button class="mini" data-act="edMove" data-kind="${kind}" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""}>↑</button>
    <button class="mini" data-act="edMove" data-kind="${kind}" data-i="${i}" data-d="1" ${i === n - 1 ? "disabled" : ""}>↓</button>
    <button class="mini" data-act="edDel" data-kind="${kind}" data-i="${i}">✕</button></div>`;
  $("#view").innerHTML = `<button class="btn sec" data-act="edCancel">← ${t("cancel")}</button><h2>${t("edit")}</h2>
    ${inp(t("fTitle"), "title", d.title)}
    <div class="field"><label>${t("fDesc")}</label><textarea class="ta" rows="2" data-f="description">${esc(d.description)}</textarea></div>
    <div class="grid2">${inp(t("fServ"), "servings", d.servings || "", "number")}${inp(t("fPrep"), "prep_min", d.prep_min || "", "number")}
    ${inp(t("fCook"), "cook_min", d.cook_min || "", "number")}${inp(t("fTotal"), "total_min", d.total_min || "", "number")}</div>
    <div class="field"><label>${t("fDiff")}</label><select data-f="difficulty">${["", "easy", "medium", "advanced"].map(k => `<option value="${k}" ${d.difficulty === k ? "selected" : ""}>${k ? t("difficulty")[k] : "–"}</option>`).join("")}</select></div>
    ${inp(t("fEquip"), "equipment", d.equipment.join(", "))}
    <h3>${t("ingredients")}</h3>
    ${d.ingredients.map((x, i) => `<div class="edrow">
      <div class="grid12">${inp(t("fAmount"), `ing.${i}.amount`, x.amount || "")}${inp(t("fName"), `ing.${i}.name`, x.name || "")}</div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="text" data-f="ing.${i}.group" value="${esc(x.group || "")}" placeholder="${esc(t("fGroup"))}" style="flex:1;min-width:0;padding:7px 10px">
      ${["-1", "1"].map(dd => `<button class="mini" data-act="edMove" data-kind="ing" data-i="${i}" data-d="${dd}" ${(dd === "-1" && i === 0) || (dd === "1" && i === n1 - 1) ? "disabled" : ""}>${dd === "-1" ? "↑" : "↓"}</button>`).join("")}
      <button class="mini" data-act="edDel" data-kind="ing" data-i="${i}">✕</button></div></div>`).join("")}
    <button class="btn sec" data-act="edAdd" data-kind="ing">${t("addIng")}</button>
    <h3>${t("steps")}</h3>
    ${d.steps.map((s, i) => { const tm = s.tm || {}; return `<div class="edrow"><b>${t("step")} ${i + 1}</b>
      <div class="field"><label>${t("fStep")}</label><textarea class="ta" rows="3" data-f="step.${i}.text">${esc(s.text)}</textarea></div>
      <div class="grid2">${inp(t("fMode"), `step.${i}.tm.mode`, tm.mode || "")}${inp(t("fTime"), `step.${i}.tm.time`, tm.time || "")}
      ${inp(t("fTemp"), `step.${i}.tm.temp`, tm.temp || "")}${inp(t("fSpeed"), `step.${i}.tm.speed`, tm.speed || "")}</div>
      <label style="font-weight:400"><input type="checkbox" data-f="step.${i}.tm.reverse" ${tm.reverse ? "checked" : ""}> ${t("fRev")}</label>
      ${inp(t("fTimer"), `step.${i}.timer_min`, s.timer_min || "", "number")}${btns("step", i, n2)}</div>`; }).join("")}
    <button class="btn sec" data-act="edAdd" data-kind="step">${t("addStep")}</button>
    <h3>${t("tips")}</h3><textarea class="ta" rows="3" data-f="tips" placeholder="${esc(t("fTips"))}">${esc(d.tips.join("\n"))}</textarea>
    <div class="row" style="margin-top:16px"><button class="btn" data-act="edSave">${t("saveEdit")}</button><button class="btn sec" data-act="edCancel">${t("cancel")}</button></div>`;
}
function finalizeDraft(d) {
  const o = clone(d);
  o.title = (o.title || "").trim();
  o.ingredients = o.ingredients.filter(i => (i.name || "").trim() || (i.amount || "").trim())
    .map(i => ({ group: (i.group || "").trim(), amount: (i.amount || "").trim(), name: (i.name || "").trim() }));
  o.steps = o.steps.map(s => {
    let tm = s.tm ? { mode: (s.tm.mode || "").trim(), time: (s.tm.time || "").trim(), temp: String(s.tm.temp || "").trim(), speed: String(s.tm.speed || "").trim(), reverse: !!s.tm.reverse } : null;
    if (tm && !(tm.mode || tm.time || tm.temp || tm.speed || tm.reverse)) tm = null;
    return { text: (s.text || "").trim(), tm, timer_min: s.timer_min > 0 ? +s.timer_min : null };
  }).filter(s => s.text || s.tm);
  o.updated = Date.now();
  return o;
}
function markCooked(id) { const s = recipes.find(x => x.id === id); if (s) { s.lastCooked = today(); saveRecipes(); } }

function markBackup() { store.set("backup", { last: Date.now(), snooze: 0 }); toast(t("backupDone")); $("#bk")?.remove(); }
async function exportBackup() {
  const json = JSON.stringify({ recipes, shop, settings: { ...settings, apiKey: "" } }, null, 1);
  const name = "tm6-chef-backup-" + today() + ".json", file = new File([json], name, { type: "application/json" });
  try {
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }); return markBackup(); } // share sheet: pick Drive / Files
  } catch (e) { if (e.name === "AbortError") return; }
  const u = URL.createObjectURL(file), l = document.createElement("a"); l.href = u; l.download = name; l.click(); setTimeout(() => URL.revokeObjectURL(u), 3000);
  markBackup();
}
function backupBanner() {
  const b = store.get("backup", {}), now = Date.now();
  if (!recipes.length || (b.last && now - b.last < 14 * 864e5) || now < (b.snooze || 0)) return "";
  return `<div class="banner" id="bk"><b>${b.last ? t("backupOld") : t("backupNever")}</b><div class="mute">${t("backupHint")}</div>
    <div class="row" style="margin:8px 0 0"><button class="btn" data-act="export">${t("backupNow")}</button><button class="btn sec" data-act="bkLater">${t("later")}</button></div></div>`;
}

/* ---------- boot ---------- */
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => { });
</script>
